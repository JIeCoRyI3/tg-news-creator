name: Split PR Commit

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  split_commit:
    if: contains(github.event.pull_request.labels.*.name, 'codex')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}
      - name: Write OpenAI key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: echo "$OPENAI_API_KEY" > openai.key
      - name: Configure git author
        run: |
          git config user.name "${{ github.event.pull_request.user.login }}"
          git config user.email "${{ github.event.pull_request.user.id }}+${{ github.event.pull_request.user.login }}@users.noreply.github.com"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Split last commit using GPT
        env:
          OPENAI_API_KEY_FILE: openai.key
          PR_DESCRIPTION: ${{ github.event.pull_request.body }}
        run: node scripts/split-commit.js
      - name: Push rewritten commits
        run: git push --force-with-lease origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload script logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-logs
          path: logs
      - name: Swap labels
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'codex' });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.issues.updateLabel({ owner, repo, name: 'develop', color: 'ff0000' });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({ owner, repo, name: 'develop', color: 'ff0000' });
              } else {
                throw error;
              }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['develop'] });
