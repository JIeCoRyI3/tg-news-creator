name: Split PR Commit

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize]

jobs:
  split_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}
      - name: Count commits
        id: commits
        run: |
          count=$(git rev-list --count origin/${{ github.base_ref }}..HEAD)
          echo "Commit count: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Write OpenAI key
        if: steps.commits.outputs.count == '1'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: echo "$OPENAI_API_KEY" > openai.key
      - name: Configure git author
        if: steps.commits.outputs.count == '1'
        run: |
          git config user.name "${{ github.event.pull_request.user.login }}"
          git config user.email "${{ github.event.pull_request.user.id }}+${{ github.event.pull_request.user.login }}@users.noreply.github.com"
      - name: Setup Node.js
        if: steps.commits.outputs.count == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        if: steps.commits.outputs.count == '1'
        run: npm ci
      - name: Split commit using GPT
        if: steps.commits.outputs.count == '1'
        env:
          OPENAI_API_KEY_FILE: openai.key
          BASE_BRANCH: ${{ github.base_ref }}
          PR_DESCRIPTION: ${{ github.event.pull_request.body }}
        run: node scripts/split-commit.js
      - name: Push rewritten commits
        if: steps.commits.outputs.count == '1'
        run: git push --force-with-lease origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload script logs
        if: steps.commits.outputs.count == '1' && always()
        uses: actions/upload-artifact@v4
        with:
          name: script-logs
          path: logs
